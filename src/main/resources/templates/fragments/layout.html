<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' · MyLedger'">MyLedger</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="navbar" class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
        <div class="flex items-center gap-6">
            <a th:href="@{/}" class="flex items-center gap-2.5 font-bold text-slate-900 tracking-tight text-lg">
                <span class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center text-sm shadow-sm">₩</span>
                <span>MyLedger</span>
            </a>
            <nav class="hidden sm:flex items-center gap-1">
                <a th:href="@{/}"
                   th:classappend="${activePage == 'dashboard'} ? 'bg-slate-100 text-slate-900 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium'"
                   class="px-3.5 py-2 rounded-lg text-sm transition">
                    Dashboard
                </a>
                <a th:href="@{/transactions}"
                   th:classappend="${activePage == 'transactions'} ? 'bg-slate-100 text-slate-900 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium'"
                   class="px-3.5 py-2 rounded-lg text-sm transition">
                    Transactions
                </a>
                <a th:href="@{/recurring}"
                   th:classappend="${activePage == 'recurring'} ? 'bg-slate-100 text-slate-900 font-semibold' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-50 font-medium'"
                   class="px-3.5 py-2 rounded-lg text-sm transition">
                    Recurring
                </a>
            </nav>
        </div>

        <div class="flex items-center gap-2.5">
            <button type="button"
                    data-open-quick-add
                    class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold shadow-sm transition">
                <span class="text-base leading-none">+</span>
                <span class="hidden sm:inline">Add Transaction</span>
                <span class="sm:hidden">Add</span>
            </button>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit"
                        class="px-3 py-2 rounded-xl text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
                    Sign Out
                </button>
            </form>
        </div>
    </div>
</header>

<div th:fragment="flashMessages" class="max-w-6xl mx-auto px-4 sm:px-6 mt-4 space-y-2">
    <div th:if="${successMessage}"
         class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm font-medium">
        <span th:text="${successMessage}">Transaction saved.</span>
        <button type="button" onclick="this.parentElement.remove()" class="text-emerald-600 hover:text-emerald-900 text-xs font-semibold">Dismiss</button>
    </div>
    <div th:if="${errorMessage}"
         class="flex items-center justify-between gap-3 px-4 py-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium">
        <span th:text="${errorMessage}">Something went wrong.</span>
        <button type="button" onclick="this.parentElement.remove()" class="text-rose-600 hover:text-rose-900 text-xs font-semibold">Dismiss</button>
    </div>
</div>

<nav th:fragment="mobileNav"
     class="sm:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 px-3 py-2 flex items-center justify-around">
    <a th:href="@{/}"
       th:classappend="${activePage == 'dashboard'} ? 'text-indigo-600 font-semibold' : 'text-slate-500 font-medium'"
       class="flex flex-col items-center gap-0.5 text-[11px] py-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-18v6h8V3h-8z"/>
        </svg>
        <span>Dashboard</span>
    </a>
    <a th:href="@{/transactions}"
       th:classappend="${activePage == 'transactions'} ? 'text-indigo-600 font-semibold' : 'text-slate-500 font-medium'"
       class="flex flex-col items-center gap-0.5 text-[11px] py-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
        <span>Transactions</span>
    </a>
    <button type="button"
            data-open-quick-add
            aria-label="Add Transaction"
            class="flex items-center justify-center w-11 h-11 -mt-5 rounded-full bg-indigo-600 text-white shadow-lg text-2xl leading-none font-light">
        +
    </button>
    <a th:href="@{/recurring}"
       th:classappend="${activePage == 'recurring'} ? 'text-indigo-600 font-semibold' : 'text-slate-500 font-medium'"
       class="flex flex-col items-center gap-0.5 text-[11px] py-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <span>Recurring</span>
    </a>
</nav>

</body>
</html>
