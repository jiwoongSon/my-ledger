<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal(returnPath)"
     id="quickAddModal"
     th:attr="data-auto-open=${openQuickAdd == true ? 'true' : 'false'}"
     class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs items-end sm:items-center justify-center p-0 sm:p-4">

    <div class="w-full sm:max-w-lg bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-200 max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <div>
                <h2 class="text-base font-bold text-slate-900">Quick Entry</h2>
                <p class="text-xs text-slate-500">Record an income or expense in KRW</p>
            </div>
            <button type="button"
                    data-close-quick-add
                    class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center text-lg">
                &times;
            </button>
        </div>

        <form th:action="@{/transactions}" th:object="${transactionForm}" method="post"
              data-transaction-form class="p-6 space-y-4">
            <input type="hidden" name="returnTo" th:value="${returnPath}">
            <input type="hidden" th:field="*{type}" data-role="type-input">

            <!-- Income / Expense Segmented Toggle -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Type</label>
                <div class="flex gap-1.5 p-1 rounded-xl bg-slate-100">
                    <button type="button" data-role="type-toggle" data-type="EXPENSE">Expense</button>
                    <button type="button" data-role="type-toggle" data-type="INCOME">Income</button>
                </div>
            </div>

            <!-- Amount -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="quickAmount" class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Amount (KRW)</label>
                    <span data-role="amount-preview" class="text-xs font-semibold text-indigo-600 tabular-nums"></span>
                </div>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 font-semibold">₩</span>
                    <input id="quickAmount"
                           type="number"
                           step="1"
                           min="1"
                           inputmode="numeric"
                           required
                           placeholder="e.g. 12500"
                           th:field="*{amount}"
                           class="w-full pl-9 pr-4 py-2.5 rounded-xl border border-slate-300 text-slate-900 font-semibold tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <p th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="mt-1 text-xs text-rose-600 font-medium"></p>
            </div>

            <!-- Category -->
            <div>
                <label for="quickCategory" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Category</label>
                <select id="quickCategory"
                        th:field="*{categoryId}"
                        th:attr="data-selected-id=*{categoryId}"
                        data-role="category-select"
                        required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </select>
                <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="mt-1 text-xs text-rose-600 font-medium"></p>
            </div>

            <!-- Date & Optional Time -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label for="quickDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Date</label>
                    <input id="quickDate"
                           type="date"
                           required
                           th:field="*{transactionDate}"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <p th:if="${#fields.hasErrors('transactionDate')}" th:errors="*{transactionDate}" class="mt-1 text-xs text-rose-600 font-medium"></p>
                </div>
                <div>
                    <label for="quickTime" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Time <span class="font-normal normal-case text-slate-400">(optional)</span></label>
                    <input id="quickTime"
                           type="time"
                           th:field="*{transactionTime}"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- Expense-only attributes: Companion & Fixed -->
            <div data-role="expense-only" class="space-y-4 pt-1">
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Companion Type</label>
                        <span data-role="food-companion-hint" class="hidden text-[11px] font-medium text-sky-700 bg-sky-50 px-2 py-0.5 rounded-full">
                            Tracked in Food &amp; Cafe analytics
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <label th:each="comp : ${companionTypes}" class="cursor-pointer">
                            <input type="radio"
                                   th:field="*{companionType}"
                                   th:value="${comp}"
                                   class="peer sr-only">
                            <div class="text-center py-2 px-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 transition"
                                 th:text="${comp.label}">
                                N/A
                            </div>
                        </label>
                    </div>
                </div>

                <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                    <input type="checkbox"
                           th:field="*{fixed}"
                           class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <div>
                        <span class="block text-sm font-semibold text-slate-800">Fixed Expense</span>
                        <span class="block text-xs text-slate-500">Recurring monthly bills such as subscriptions, rent, or loan interest</span>
                    </div>
                </label>
            </div>

            <!-- Memo -->
            <div>
                <label for="quickMemo" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Memo <span class="font-normal normal-case text-slate-400">(optional)</span></label>
                <input id="quickMemo"
                       type="text"
                       maxlength="255"
                       placeholder="e.g. Lunch with team, monthly Netflix plan"
                       th:field="*{memo}"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <p th:if="${#fields.hasErrors('memo')}" th:errors="*{memo}" class="mt-1 text-xs text-rose-600 font-medium"></p>
            </div>

            <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button"
                        data-close-quick-add
                        class="px-4 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">
                    Cancel
                </button>
                <button type="submit"
                        class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
                    Save Transaction
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
