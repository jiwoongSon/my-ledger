<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center px-4 py-12">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-slate-900 text-white text-xl font-bold shadow-md mb-4">
            ₩
        </div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">MyLedger</h1>
        <p class="mt-1 text-sm text-slate-500">Personal Finance &amp; Spending Analytics</p>
    </div>

    <div class="card-surface p-6 sm:p-8">
        <div th:if="${param.error}"
             class="mb-5 px-4 py-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium">
            Invalid username or password. Please try again.
        </div>

        <div th:if="${param.logout}"
             class="mb-5 px-4 py-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-medium">
            You have been signed out successfully.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                    Username
                </label>
                <input id="username"
                       name="username"
                       type="text"
                       required
                       autofocus
                       autocomplete="username"
                       placeholder="Enter your username"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                    Password
                </label>
                <input id="password"
                       name="password"
                       type="password"
                       required
                       autocomplete="current-password"
                       placeholder="Enter your password"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <button type="submit"
                    class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold shadow-sm transition mt-2">
                Sign In
            </button>
        </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
        Private single-user ledger · Secured with Spring Security
    </p>
</div>

</body>
</html>
