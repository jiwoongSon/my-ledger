services:
  db:
    image: postgres:16-alpine
    container_name: myledger-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myledger}
      POSTGRES_USER: ${POSTGRES_USER:-myledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myledger}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myledger} -d ${POSTGRES_DB:-myledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myledger-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/myledger}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-myledger}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-myledger}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-myledger1234}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:
